<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Missão Português 3T</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Nenética Liloca 2: o mesmo conteúdo da versão 1, agora com cara de game:
   personagem próprio, ilhas, moedas, loja, medalhas, corrida de obstáculos e desenhos com movimento. */
:root {
  --bg: #EAF4FF; --sky1: #9FD8FF; --sky2: #DDF1FF; --sky3: #FFEFFA;
  --surface: #FFFFFF; --ink: #1C2A44; --muted: #56647F; --line: #CFDDEE; --edge: #B9CBE2;
  --w1: #2D6BD3; --w1s: #DCE8FB; --w1d: #1D4E9E; --w2: #17866A; --w2s: #D5F0E7; --w2d: #0F6550;
  --w3: #8048CC; --w3s: #EBDFFA; --w3d: #5F2FA0; --w4: #C2562B; --w4s: #FBE2D6; --w4d: #93401E;
  --sun: #E9A919; --suns: #FCF0CF; --sund: #B07D0B; --ok: #198F52; --oks: #DAF3E5; --almost: #C5701C; --almosts: #FBE8D3;
  --coin: #F5B800; --coind: #C98F00;
  --owl: #7C5A3C; --owlb: #E7CFA8;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121A33; --sky1: #0E1430; --sky2: #1B1F4A; --sky3: #2A1A45;
  --surface: #1C2646; --ink: #EEF2FB; --muted: #A9B4CC; --line: #2E3C62; --edge: #3A4A76;
  --w1: #78A6F4; --w1s: #22355A; --w1d: #4C78C6; --w2: #52C6A0; --w2s: #173D36; --w2d: #2E9577;
  --w3: #B48DF2; --w3s: #33274F; --w3d: #8562C4; --w4: #F0936A; --w4s: #45281C; --w4d: #C06A45;
  --sun: #F4C455; --suns: #3D3320; --sund: #C49A33; --ok: #55CB8D; --oks: #173B2A; --almost: #EFA25A; --almosts: #43301D;
  --owl: #B78D63; --owlb: #EAD5B3; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121A33; --sky1: #0E1430; --sky2: #1B1F4A; --sky3: #2A1A45;
  --surface: #1C2646; --ink: #EEF2FB; --muted: #A9B4CC; --line: #2E3C62; --edge: #3A4A76;
  --w1: #78A6F4; --w1s: #22355A; --w1d: #4C78C6; --w2: #52C6A0; --w2s: #173D36; --w2d: #2E9577;
  --w3: #B48DF2; --w3s: #33274F; --w3d: #8562C4; --w4: #F0936A; --w4s: #45281C; --w4d: #C06A45;
  --sun: #F4C455; --suns: #3D3320; --sund: #C49A33; --ok: #55CB8D; --oks: #173B2A; --almost: #EFA25A; --almosts: #43301D;
  --owl: #B78D63; --owlb: #EAD5B3; color-scheme: dark }

html, body { height: 100%; }
html { overflow-x: hidden; } @supports (overflow: clip) { html, body { overflow-x: clip; } }
body { margin: 0; background: var(--bg); background-image: linear-gradient(180deg, var(--sky1), var(--sky2) 55%, var(--sky3)); background-attachment: fixed; color: var(--ink); font-family: var(--body); font-size: 19px; line-height: 1.55; overflow-x: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
strong { font-weight: 700; }
#app { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.w-1 { --c: var(--w1); --cs: var(--w1s); --cd: var(--w1d); }
.w-2 { --c: var(--w2); --cs: var(--w2s); --cd: var(--w2d); }
.w-3 { --c: var(--w3); --cs: var(--w3s); --cd: var(--w3d); }
.w-4 { --c: var(--w4); --cs: var(--w4s); --cd: var(--w4d); }
.w-x { --c: var(--sun); --cs: var(--suns); --cd: var(--sund); }
body { --c: var(--w1); --cs: var(--w1s); --cd: var(--w1d); }

/* ---------- Céu animado (nuvens e brilhos no fundo) ---------- */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.cloud { position: absolute; width: 160px; height: 46px; border-radius: 99px; background: rgba(255,255,255,.75); animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
.cloud::before { width: 70px; height: 70px; left: 24px; top: -34px; }
.cloud::after { width: 54px; height: 54px; left: 80px; top: -24px; }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(calc(100vw + 220px)); } }
.tw { position: absolute; width: 14px; height: 14px; background: #FFFFFF; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: twinkle 2.6s ease-in-out infinite; opacity: .2; }
@keyframes twinkle { 50% { opacity: .95; transform: scale(1.3) rotate(20deg); } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cloud { background: rgba(160,170,230,.12); } }
:root[data-theme="dark"] .cloud { background: rgba(160,170,230,.12); }

/* ---------- Botões de game (com "degrau" embaixo) ---------- */
.btn { border: 0; border-radius: 16px; padding: 12px 18px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; min-height: 56px; position: relative; transition: transform .08s, box-shadow .08s; }
.btn.pri { background: var(--c); color: #FFFFFF; flex: 1; box-shadow: 0 5px 0 var(--cd); }
.btn.pri:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 var(--cd); }
.btn.pri[disabled] { background: var(--line); color: var(--muted); cursor: not-allowed; box-shadow: 0 5px 0 var(--edge); }
.btn.pri:not([disabled])::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 45%, transparent 60%); background-size: 250% 100%; animation: shine 2.8s ease-in-out infinite; pointer-events: none; }
@keyframes shine { 0% { background-position: 130% 0; } 60%, 100% { background-position: -60% 0; } }
.btn.sec { background: var(--surface); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--edge); }
.btn.sec:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn.gold { background: var(--coin); color: #3A2800; box-shadow: 0 5px 0 var(--coind); flex: 1; }
.btn.big { width: 100%; }
.ghost { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 12px; font-weight: 700; font-size: .95rem; box-shadow: 0 3px 0 var(--edge); }
.ghost.on { border-color: var(--c); background: var(--cs); color: var(--c); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 200px; }
.note { color: var(--muted); font-size: .9rem; }

/* ---------- Moedas ---------- */
.coins { display: inline-flex; align-items: center; gap: 5px; font-family: var(--display); font-weight: 800; font-size: 1.05rem; padding: 2px 10px 2px 4px; border-radius: 99px; background: var(--surface); border: 2px solid var(--coin); }
.coins svg { width: 24px; height: 24px; }
.coins.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.3); } }
.fly { position: fixed; z-index: 60; pointer-events: none; font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--coind); display: flex; align-items: center; gap: 4px; text-shadow: 0 2px 0 #FFFFFF; animation: flyup 1.1s ease-out forwards; }
.fly svg { width: 28px; height: 28px; }
@keyframes flyup { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -14px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -90px) scale(1); opacity: 0; } }

/* ---------- Personagem ---------- */
.av { display: block; overflow: visible; }
.av.idle { animation: idle 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes idle { 50% { transform: translateY(-4px) scaleY(1.02); } }
.av.jump { animation: jump .7s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 100%; }
@keyframes jump { 0% { transform: scale(1.1, .85); } 35% { transform: translateY(-34%) scale(.95, 1.08) rotate(-6deg); } 70% { transform: translateY(0) scale(1.08, .9); } 100% { transform: none; } }
.av.dance { animation: dance 1s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes dance { 25% { transform: rotate(-8deg) translateY(-8px); } 50% { transform: none; } 75% { transform: rotate(8deg) translateY(-8px); } }
.av.wobble { animation: wobble .6s; transform-origin: 50% 100%; }
@keyframes wobble { 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
.av .arm-r { transform-origin: 81px 64px; }
.av.idle .arm-r, .av.wave .arm-r { animation: wave 2.4s ease-in-out infinite; }
@keyframes wave { 0%, 60%, 100% { transform: none; } 70% { transform: rotate(-140deg); } 80% { transform: rotate(-110deg); } 90% { transform: rotate(-140deg); } }
.av .blink { animation: blink 4s infinite; transform-origin: 50% 38px; }
@keyframes blink { 0%, 94%, 100% { transform: none; } 97% { transform: scaleY(.1); } }
.av .wing { animation: flap 1.4s ease-in-out infinite; }
.av .wing.l { transform-origin: 36px 70px; } .av .wing.r { transform-origin: 64px 70px; }
@keyframes flap { 50% { transform: scaleX(.8); } }
.av .fxs { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.av .heart { animation: floaty 2.6s ease-in-out infinite; transform-box: fill-box; }
@keyframes floaty { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
.av .aura { animation: aura 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes aura { 50% { opacity: .35; transform: scale(1.06); } }
.av .pet { animation: petbob 1.2s ease-in-out infinite; }
@keyframes petbob { 50% { transform: translateY(-3px); } }
.av .jet { animation: jet .25s linear infinite alternate; transform-box: fill-box; transform-origin: top; }
@keyframes jet { to { transform: scaleY(1.35); } }
.buddy { width: 34px; height: 46px; flex: none; }

/* ---------- Início: perfil e mapa de ilhas ---------- */
.home { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 20px; }
.hero { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 14px; box-shadow: 0 6px 0 var(--edge); }
.hero .av { width: 110px; height: 150px; }
.hero h1 { font-size: 1.7rem; }
.hero p { margin: 2px 0 8px; color: var(--muted); font-size: .98rem; }
.hero .row { gap: 8px; }
.hero .row .btn { flex: 1 1 120px; min-height: 46px; font-size: 1rem; padding: 8px 10px; }
.map { position: relative; display: flex; flex-direction: column; gap: 0; padding: 6px 0 10px; }
.isl-row { display: flex; flex-direction: column; align-items: flex-start; position: relative; }
.isl-row.r { align-items: flex-end; }
.bridge { width: 46%; height: 34px; margin: -6px 0 -2px 25%; background: radial-gradient(circle, rgba(255,255,255,.95) 4px, transparent 5px) 0 50% / 22px 34px repeat-x; transform: rotate(-12deg); }
.bridge.l { transform: rotate(12deg); }
.isl { border: 0; background: none; padding: 0; width: min(78%, 330px); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
.isl-art { position: relative; width: 100%; aspect-ratio: 200 / 150; display: block; animation: bob 4.5s ease-in-out infinite; }
.isl-row:nth-child(2n) .isl-art { animation-delay: -1.7s; }
.isl-row:nth-child(3n) .isl-art { animation-delay: -3s; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.isl-art > svg { width: 100%; height: 100%; display: block; }
.isl.here .isl-art > svg { filter: drop-shadow(0 0 14px var(--c)); animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 4px var(--c)); } }
.isl-ic { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); width: 56px; height: 56px; border-radius: 18px; background: var(--c); color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 4px 0 var(--cd); }
.isl-ic svg { width: 32px; height: 32px; }
.isl-av { position: absolute; left: 63%; top: 2%; width: 26%; }
.isl-av .av { width: 100%; height: auto; }
.isl-av.hop { animation: hop .7s ease-out; }
@keyframes hop { 0% { transform: translateY(-120px) scale(.6); opacity: 0; } 60% { transform: translateY(8px) scale(1.05); opacity: 1; } 100% { transform: none; } }
.isl-t { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: -6px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 8px 16px; box-shadow: 0 4px 0 var(--edge); }
.isl-t .k { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--c); font-weight: 800; }
.isl-t b { font-family: var(--display); font-size: 1.25rem; line-height: 1.1; }
.isl:hover .isl-t { border-color: var(--c); }
.flag { position: absolute; right: 18%; top: 14%; width: 16%; }
.obbybtn { margin: 8px 0 0; }
.isl-row.r .obbybtn { margin-right: 6%; } .isl-row.l .obbybtn { margin-left: 6%; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; font-size: .88rem; }
.pill { padding: 1px 10px; border-radius: 99px; background: var(--cs); color: var(--c); font-weight: 700; }
.pill.done { background: var(--oks); color: var(--ok); }
.starsmall { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
.starsmall svg { width: 18px; height: 18px; color: var(--sun); fill: var(--sun); }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 5px 0 var(--edge); }
.panel h3 { font-size: 1.2rem; margin-bottom: 8px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.toggle:first-of-type { border-top: 0; }
.sw { width: 58px; height: 34px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); transition: left .2s; }
.sw[aria-checked="true"] { background: var(--ok); }
.sw[aria-checked="true"]::after { left: 28px; }
details.parents summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.misslist { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 8px; font-size: .95rem; }
.misslist small { color: var(--muted); display: block; }
.ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }

/* ---------- Criar personagem e loja ---------- */
.studio { display: flex; flex-direction: column; gap: 14px; }
.preview { display: grid; place-items: center; background: radial-gradient(circle at 50% 70%, var(--cs), transparent 70%); border-radius: 20px; padding: 6px 0; }
.preview .av { width: 150px; height: 205px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: .95rem; box-shadow: 0 3px 0 var(--edge); }
.tab.on { background: var(--c); border-color: var(--c); color: #FFFFFF; box-shadow: 0 3px 0 var(--cd); }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.choice { border: 3px solid var(--line); background: var(--surface); border-radius: 16px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .82rem; font-weight: 700; line-height: 1.2; position: relative; }
.choice .av { width: 62px; height: 84px; }
.choice.on { border-color: var(--c); background: var(--cs); }
.choice .price { display: inline-flex; align-items: center; gap: 2px; color: var(--coind); font-family: var(--display); }
.choice .price svg { width: 16px; height: 16px; }
.choice.lock .av { opacity: .55; }
.sw8 { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 2px solid rgba(0,0,0,.12); }
.buybar { display: flex; gap: 10px; align-items: center; background: var(--suns); border-radius: 16px; padding: 10px 12px; }
.buybar p { margin: 0; flex: 1; font-weight: 700; }
.namebox { display: flex; gap: 8px; flex-wrap: wrap; }
.namebox input { font: inherit; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; flex: 1 1 180px; }

/* ---------- Medalhas ---------- */
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.medal { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; box-shadow: 0 4px 0 var(--edge); }
.medal svg { width: 70px; height: 80px; }
.medal.got svg { animation: spin3d 4s ease-in-out infinite; }
@keyframes spin3d { 0%, 70%, 100% { transform: none; } 85% { transform: scaleX(-1); } }
.medal.no svg { filter: grayscale(1); opacity: .35; }
.medal b { font-family: var(--display); font-size: 1rem; line-height: 1.15; }
.medal small { color: var(--muted); font-size: .8rem; line-height: 1.3; }
.toast { position: fixed; left: 50%; top: 14px; z-index: 70; transform: translateX(-50%); width: min(92vw, 420px); display: flex; gap: 12px; align-items: center; background: var(--surface); border: 3px solid var(--coin); border-radius: 20px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: toast 3.4s ease-in-out forwards; overflow: hidden; }
.toast svg { width: 52px; height: 60px; flex: none; }
.toast b { font-family: var(--display); font-size: 1.15rem; display: block; line-height: 1.15; }
.toast::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,230,120,.55) 45%, transparent 60%); background-size: 250% 100%; animation: shine 1.4s ease-in-out 2; }
@keyframes toast { 0% { transform: translate(-50%, -140%); } 10%, 88% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -140%); } }

/* ---------- Topo e rodapé ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topin { display: flex; align-items: center; gap: 8px; padding-block: 8px; flex-wrap: wrap; }
.ttl { font-family: var(--display); font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { width: 100%; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--c), var(--sun)); border-radius: 99px; transition: width .5s cubic-bezier(.3,1.4,.5,1); position: relative; }
.bar > i::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,255,255,.25) 0 8px, transparent 8px 16px); animation: barmove 1s linear infinite; }
@keyframes barmove { to { background-position: 22px 0; } }
.stage { flex: 1; padding-block: 22px 120px; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.footin { display: flex; gap: 10px; padding-block: 12px; }

/* ---------- Cartões e telas ---------- */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 var(--edge); animation: popin .45s cubic-bezier(.3,1.5,.5,1); }
.card.back { animation: popback .45s cubic-bezier(.3,1.5,.5,1); }
@keyframes popin { from { transform: translateX(40px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popback { from { transform: translateX(-40px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.cardhead { display: flex; gap: 14px; align-items: center; }
.bigic { width: 72px; height: 72px; flex: none; border-radius: 20px; background: var(--c); color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 4px 0 var(--cd); animation: icpop .6s cubic-bezier(.3,1.8,.5,1) .1s both; }
@keyframes icpop { from { transform: scale(.3) rotate(-25deg); } to { transform: none; } }
.bigic svg { width: 42px; height: 42px; }

const player = new Audio(); let playToken = 0;
function speak(key, onend) {
  const my = ++playToken;
  const fin = () => { if (my === playToken && onend) onend(); };
  if (!AUDIO.has(key)) { if (onend) setTimeout(fin, 300); return; }
  try {
    player.pause(); player.src = "audio/" + key + ".mp3"; player.onended = fin; player.onerror = fin;
    const p = player.play(); if (p && p.catch) p.catch(fin);
  } catch (e) { fin(); }
}

/* ---------- Sons do jogo (feitos na hora, sem arquivo) ---------- */
let actx = null;
function tone(seq, type, vol) {
  if (!st.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    seq.forEach(([f, at, dur, f2]) => {
      const o = actx.createOscillator(), g = actx.createGain(), s = t + at;
      o.type = type || "triangle"; o.frequency.setValueAtTime(f, s); if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + dur);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(vol || 0.12, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + dur + 0.05);
    });
  } catch (e) {}
}

  win: () => tone([[523.25, 0, .25], [659.25, .09, .25], [783.99, .18, .25], [1046.5, .27, .6]]),

/* ---------- Festa do acerto: som, confete, estrelas, moedas e o personagem pulando ---------- */
function confetti(n) {
  if (!moving()) return;
  const cols = ["#F2B632", "#2D6BD3", "#17866A", "#8048CC", "#E53935", "#FB8C00", "#F06AB0", "#3CC4A0"];
  const box = document.createElement("div"); box.className = "confete";
  for (let i = 0; i < (n || 48); i++) {
    const c = document.createElement("i"); c.className = ["", "o", "s"][i % 3];
    c.style.left = (Math.random() * 100) + "%";
    c.style.background = cols[i % cols.length];
    c.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    c.style.setProperty("--rt", (Math.random() * 900 - 450) + "deg");
    c.style.animationDelay = (Math.random() * 0.35) + "s";
    c.style.animationDuration = (1.5 + Math.random() * 0.9) + "s";
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2800);
}
function burst(parent, x, y, n, color) {
  if (!moving() || !parent) return;
  const b = document.createElement("span"); b.className = "burst"; b.style.left = x; b.style.top = y;
  for (let i = 0; i < (n || 10); i++) {
    const s = document.createElement("i"), ang = (i / (n || 10)) * Math.PI * 2, r = 40 + Math.random() * 30;
    s.style.setProperty("--bx", Math.cos(ang) * r + "px"); s.style.setProperty("--by", Math.sin(ang) * r + "px");
    if (color) s.style.background = color; else if (i % 2) s.style.background = "#FFFFFF";
    b.appendChild(s);
  }
  parent.appendChild(b); setTimeout(() => b.remove(), 900);
}
function buddyAct(cls) {
  document.querySelectorAll(".buddy-host .av, .fbav .av").forEach(el => { el.classList.remove("idle", "jump", "wobble"); void el.getBoundingClientRect(); el.classList.add(cls); setTimeout(() => { el.classList.remove(cls); el.classList.add("idle"); }, 800); });
}
function gain(n, el) {
  if (!n) return;
  P.coins += n; saveP();
  const top = document.getElementById("coinTop");
  if (top) { top.querySelector("span").textContent = P.coins; top.classList.remove("bump"); void top.offsetWidth; top.classList.add("bump"); }
  sfx.coin();
  const r = (el || top || document.body).getBoundingClientRect();
  const f = document.createElement("div"); f.className = "fly"; f.innerHTML = COIN + "+" + n;
  f.style.left = (r.left + r.width / 2) + "px"; f.style.top = Math.max(40, r.top) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
}
let streak = 0;

/* ---------- Criar personagem e loja (a mesma tela) ---------- */
function studio(first) {
  stopSpeak(); S = null; E = null; O = null; video = false;

  document.body.className = "w-3";
  function owned(k, v) { return !v || P.owned.indexOf(k + ":" + v) >= 0; }
  function priceOf(k, v) { const it = (SHOP[k] || []).find(x => x[0] === v); return it ? it[2] : 0; }
  function draw() {
    const cat = CATS[tab], shown = Object.assign({}, P.av, trial ? { [trial[0]]: trial[1] } : {});
    let choices = "";
    if (cat.col) choices = cat.col.map(c => '<button class="choice' + (P.av[cat.k] === c ? ' on' : '') + '" data-v="' + c + '" aria-label="Cor"><span class="sw8" style="background:' + c + '"></span></button>').join("");
    else if (cat.list) choices = cat.list.map(([v, t]) => '<button class="choice' + (P.av[cat.k] === v ? ' on' : '') + '" data-v="' + v + '">' + avSvg(Object.assign({}, P.av, { [cat.k]: v, acc: "", pet: "", fx: "", back: "" })) + t + '</button>').join("");
    else {

    }
    let buy = "";
    if (trial) {
      const pr = priceOf(trial[0], trial[1]), name = SHOP[trial[0]].find(x => x[0] === trial[1])[1];
      buy = '<div class="buybar"><p>' + esc(name) + ': ' + pr + ' moedas</p>' + (P.coins >= pr ? '<button class="btn gold" id="buy">Comprar</button>' : '<span class="note">Faltam ' + (pr - P.coins) + ' moedas. Acerte mais perguntas!</span>') + '</div>';
    }

      buy + '<div class="choices">' + choices + '</div>' +

/* ---------- Mundo ---------- */
function openWorld(wid) {
  const w = W.find(x => x.id === wid);
  const ws = st.worlds[wid] || {};
  let pos = ws.done ? 0 : (ws.pos || 0);
  if (pos >= w.steps.length) pos = 0;
  S = { w, steps: w.steps.slice(), pos, review: [], reviewAdded: false, done: false };
  if (VIDEOS.has(w.id) && pos === 0) S.steps.unshift({ t: "video", key: "v-" + w.id, src: "video/" + w.id + ".mp4", extra: true });
  renderStep();
}

function renderStep() {
  const step = S.steps[S.pos];
  S.done = (step.t === "card" || step.t === "summary" || step.t === "video" || step.t === "read");
  const box = shell(S.w.cls, "Ilha " + S.w.n + " · " + S.w.title, (S.pos + 1) / S.steps.length, worldStars(S.w) + "/" + interactiveIds(S.w).length);
  const bNext = document.getElementById("bNext"), bBack = document.getElementById("bBack"), bSpeak = document.getElementById("bSpeak"), bVideo = document.getElementById("bVideo");
  bBack.disabled = S.pos === 0; if (S.pos === 0) bBack.style.visibility = "hidden";
  bNext.textContent = S.pos === S.steps.length - 1 ? "Terminar a ilha" : "Próximo";
  bNext.onclick = next;
  bBack.onclick = () => { stopSpeak(); if (S.pos > 0) { S.pos--; dir = -1; renderStep(); } };
  if (bSpeak) { if (!AUDIO.has(step.key)) bSpeak.style.visibility = "hidden"; bSpeak.onclick = () => speak(step.key); }
  if (bVideo) bVideo.onclick = () => { video = !video; if (!video) stopSpeak(); bVideo.classList.toggle("on", video); bVideo.textContent = video ? "Pausar" : "Modo vídeo"; bVideo.setAttribute("aria-pressed", video); if (video) playCard(step); };

  if (step.t === "card") renderCard(step, box);
  else if (step.t === "quiz") renderQuiz(step, box, ok => { stepDone(step, ok); });
  else if (step.t === "order") renderOrder(step, box);
  else if (step.t === "match") renderMatch(step, box);
  else if (step.t === "sort") renderSort(step, box);
  else if (step.t === "write") renderWrite(step, box);
  else if (step.t === "summary") renderSummary(step, box);
  else if (step.t === "video") renderVideo(step, box);
  else if (step.t === "read") renderRead(step, box);
  else if (step.t === "scene") renderScene(step, box);
  updNext();

  if (step.t === "video") return;
  if (video) playCard(step);
  else if (st.settings.autoVoice) speak(step.key);
}
function playCard(step) {
  if (step.t !== "card" && step.t !== "read") { speak(step.key); return; }
  const at = S.pos;
  speak(step.key, () => { setTimeout(() => { if (video && S && S.pos === at) next(); }, 1300); });
}
function updNext() { const b = document.getElementById("bNext"); if (b) b.disabled = !S.done; }
function earn(id) {
  if (!id) return;
  if (!st.stars[id]) {
    st.stars[id] = true; save(); badge("estrela1"); gain(10, document.getElementById("starsTop"));
    const el = document.getElementById("starsTop"); if (el) el.innerHTML = icon("star") + worldStars(S.w) + "/" + interactiveIds(S.w).length;
  } else gain(2);
}
function stepDone(step, ok) {
  S.done = true; updNext();
  if (step.t === "quiz") {
    if (ok) earn(step.id); else miss();
    if (!ok) { st.misses[step.id] = (st.misses[step.id] || 0) + 1; save(); if (!step.review && !S.review.some(r => r.id === step.id)) S.review.push(Object.assign({}, step, { review: true })); }
  } else if (step.t === "scene") {
    if (ok) earn(step.id);
    if (!ok && !step.review && !S.review.some(r => r.id === step.id)) S.review.push(Object.assign({}, step, { review: true }));
  } else earn(step.id);
}

function next() {
  stopSpeak();
  if (!S.done) return;
  if (S.pos >= S.steps.length - 1) { finishWorld(); return; }
  const nx = S.steps[S.pos + 1];
  if (!S.reviewAdded && S.review.length && nx.t === "summary") {
    S.reviewAdded = true;
    const intro = { t: "card", key: "rev-intro", ic: "star", eb: "Revisão rápida", title: "Vamos revisar", text: ["Agora vêm de novo as perguntas que você errou. Errar faz parte de aprender.", "Leia com calma. Você já viu a resposta antes."], review: true };
    S.steps.splice(S.pos + 1, 0, intro, ...shuffle(S.review));
  }
  S.pos++;
  const base = S.w.steps.indexOf(S.steps[S.pos]);
  if (base >= 0) { st.worlds[S.w.id] = Object.assign({}, st.worlds[S.w.id], { pos: base }); save(); }
  renderStep();
}

function finishWorld() {
  const first = !(st.worlds[S.w.id] || {}).done;
  st.worlds[S.w.id] = Object.assign({}, st.worlds[S.w.id], { pos: 0, done: true }); save();
  const w = S.w; video = false;
  const idx = W.indexOf(w), nxt = W[idx + 1];
  const pic = PICS.find(p => p.need === w.id);
  const box = shell(w.cls, "Ilha " + w.n + " concluída", 1, worldStars(w) + "/" + interactiveIds(w).length);
  const bv = document.getElementById("bVideo"); if (bv) bv.hidden = true;
  box.innerHTML = '<div class="card center"><div class="endav">' + avSvg(P.av, "dance") + '</div><p class="eyebrow">Ilha ' + w.n + ' concluída</p><h2>Parabéns, ' + esc(P.name) + '!</h2>' +
    '<p class="bigscore">' + worldStars(w) + ' de ' + interactiveIds(w).length + '</p><p>estrelas nesta ilha</p>' +
    (first ? '<div class="dica" style="text-align:left">' + COIN.replace('<svg', '<svg style="width:28px;height:28px;flex:none"') + '<p><b>Prêmio da ilha: 30 moedas.</b> Gaste na loja do personagem.</p></div>' : '') +
    '<div class="dica" style="text-align:left">' + icon("run") + '<p><b>Corrida de obstáculos liberada!</b> Ela fica embaixo da ilha, no mapa.</p></div>' +
    (pic ? '<div class="dica" style="text-align:left">' + icon("brush") + '<p><b>Quadro novo liberado:</b> ' + esc(pic.title) + '. Ele está no início, em "Quadros para pintar".</p></div>' : '') +
    '<div class="dica" style="text-align:left">' + icon("heart") + '<p><b>Hora da pausa.</b> Beba um copo de água, estique os braços e descanse uns minutinhos antes da próxima ilha.</p></div></div>';
  const bNext = document.getElementById("bNext"), bBack = document.getElementById("bBack"), bSpeak = document.getElementById("bSpeak");
  if (bSpeak) { if (!AUDIO.has("fim-ala")) bSpeak.style.visibility = "hidden"; bSpeak.onclick = () => speak("fim-ala"); }
  if (st.settings.autoVoice) speak("fim-ala");
  bBack.style.visibility = "visible"; bBack.disabled = false;
  bBack.textContent = "Mapa"; bBack.onclick = home;
  bNext.textContent = pic ? "Pintar o quadro novo" : (nxt ? "Ir para a Ilha " + nxt.n : "Ir para o castelo");
  bNext.disabled = false;
  bNext.onclick = () => pic ? openPaint(pic) : (nxt ? openWorld(nxt.id) : openExam());
  sfx.fanfare(); confetti(80); setTimeout(() => confetti(50), 900);
  if (first) setTimeout(() => gain(30, box.querySelector(".bigscore")), 600);
  badge("mundo-" + w.id);
}

/* ---------- Tipos de tela ---------- */
function clipOf(img) { const b = String(img).replace(/^cenas\//, "").replace(/\.[a-z]+$/, ""); return CLIPS.has(b) ? "cenas/" + b + ".mp4" : ""; }
function glints(n) { let h = '<span class="glints" aria-hidden="true">'; for (let i = 0; i < (n || 6); i++) h += '<i style="left:' + (5 + Math.random() * 88) + '%;top:' + (5 + Math.random() * 85) + '%;animation-delay:-' + (Math.random() * 3.2).toFixed(2) + 's"></i>'; return h + '</span>'; }
function renderRead(step, box) {
  const clip = clipOf(step.img);
  const media = clip ? '<video class="clip" src="' + clip + '" poster="' + step.img + '" autoplay muted loop playsinline></video>' : '<img width="1100" height="825" src="' + step.img + '" alt="' + esc(step.title) + '">';
  box.innerHTML = '<article class="card"><div><p class="eyebrow">' + esc(step.eb) + '</p><h2>' + esc(step.title) + '</h2></div>' +
    '<div class="scene' + (clip ? '' : ' kb') + '">' + media + glints(5) + '<span class="clio-fly">' + OWL + '</span></div>' +
    '<div class="school"><span class="tag">Texto da escola</span>' + step.school.map(p => '<p>' + md(p) + '</p>').join("") + '</div>' +
    '<p class="note">' + (AUDIO.has(step.key) ? 'Toque em Ouvir para a Clio ler junto com você.' : 'Leia com calma. Depois vamos explorar o desenho.') + '</p></article>';
}
function renderScene(step, box) {
  box.innerHTML = '<article class="card"><div><p class="eyebrow">' + (step.review ? 'Revisão' : 'Toque para descobrir') + '</p><h2>' + esc(step.title) + '</h2></div>' +
    '<div class="scene reveal" id="sc"><img width="1100" height="825" src="' + step.img + '" alt="' + esc(step.title) + '">' + glints(4) + '</div>' +
    '<div class="slabel" id="sl">Toque nos pontos brilhantes para descobrir o que é cada parte.</div><p class="note" id="scnt"></p>' +
    '<div class="row"><button class="btn pri" id="sgo">Fazer o desafio</button><button class="btn sec" id="sck" hidden>Conferir</button></div></article>';
  const sc = box.querySelector("#sc"), lab = box.querySelector("#sl"), cnt = box.querySelector("#scnt"), go = box.querySelector("#sgo"), ck = box.querySelector("#sck");
  const seen = new Set(), hots = []; let mode = "learn", ci = 0, picks = new Set(), checked = false, allOk = true;
  const upd = () => { cnt.textContent = mode !== "learn" ? "" : (seen.size === step.spots.length ? "Você descobriu tudo! Agora faça o desafio." : "Descobertas: " + seen.size + " de " + step.spots.length); };
  const ctr = s => [(s.x + s.w / 2) + "%", (s.y + s.h / 2) + "%"];
  step.spots.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "hot"; b.setAttribute("aria-label", s.t);
    b.style.left = s.x + "%"; b.style.top = s.y + "%"; b.style.width = s.w + "%"; b.style.height = s.h + "%";
    b.onclick = () => {
      if (mode === "learn") {
        hots.forEach(x => x.classList.remove("on")); b.classList.add("on", "seen");
        const isNew = !seen.has(i); seen.add(i);
        lab.innerHTML = "<b>" + esc(s.t) + ":</b> " + esc(s.d); lab.classList.remove("pop"); void lab.offsetWidth; lab.classList.add("pop");
        upd(); speak(step.id + "-s" + i);
        if (isNew) { sfx.pop(); const c = ctr(s); burst(sc, c[0], c[1], 8); const fk = step.id + "-" + i; if (!st.found[fk]) { st.found[fk] = 1; save(); gain(1, b); } }
        if (seen.size === step.spots.length && isNew) { badge("explora"); confetti(30); }
        return;
      }
      if (mode !== "chal" || checked) return;
      const c = step.chal[ci];
      if (c.ok.length === 1) { picks = new Set([i]); check(); return; }
      sfx.pop();
      if (picks.has(i)) { picks.delete(i); b.classList.remove("pick"); } else { picks.add(i); b.classList.add("pick"); }
      ck.hidden = picks.size === 0;
    };
    hots.push(b); sc.appendChild(b);
  });
  function startChal(k) {
    mode = "chal"; ci = k; picks = new Set(); checked = false;
    sc.classList.add("chal"); hots.forEach(x => x.className = "hot");
    const c = step.chal[ci];
    lab.innerHTML = '<span class="q">Desafio ' + (ci + 1) + ' de ' + step.chal.length + ':</span> ' + esc(c.q) + (c.ok.length > 1 ? '<br><span class="note">Marque as bolinhas e depois toque em Conferir.</span>' : '');
    go.hidden = true; ck.hidden = true; ck.textContent = "Conferir"; ck.onclick = check; upd();
    speak(step.id + "-c" + ci);
  }
  function check() {
    checked = true; const c = step.chal[ci], ok = new Set(c.ok), wrong = [], missed = [];
    hots.forEach((b, i) => {
      b.classList.remove("pick");
      if (ok.has(i) && picks.has(i)) { b.classList.add("right"); const cc = ctr(step.spots[i]); burst(sc, cc[0], cc[1], 12); }
      else if (!ok.has(i) && picks.has(i)) { b.classList.add("wrong"); wrong.push(step.spots[i]); }
      else if (ok.has(i)) { b.classList.add("missed"); missed.push(step.spots[i]); }
    });
    const perfect = !wrong.length && !missed.length;
    if (!perfect) allOk = false;
    let msg = perfect ? "<b>" + pick(YES) + "</b> " + c.ok.map(i => esc(step.spots[i].d)).join(" ") : "<b>Quase!</b>";
    if (wrong.length) msg += wrong.map(s => "<br><b>" + esc(s.t) + "</b> não entra nesta resposta. " + esc(s.d)).join("");
    if (missed.length) msg += "<br>Faltou marcar: " + missed.map(s => "<b>" + esc(s.t) + "</b>").join(", ") + " (piscando).";
    lab.innerHTML = msg;
    if (perfect) celebrate(); else { miss(); speak("fb-quase"); }
    const last = ci === step.chal.length - 1;
    ck.hidden = false;
    if (last) { ck.textContent = "Fazer de novo"; ck.onclick = () => startChal(0); stepDone(step, allOk); mode = "done"; cnt.textContent = allOk ? "Desafio completo!" : "Desafio completo. Esta cena volta para revisão no final."; }
    else { ck.textContent = "Próximo desafio"; ck.onclick = () => startChal(ci + 1); }
  }
  go.onclick = () => { allOk = true; startChal(0); };
  upd();
}
function renderCard(step, box) {
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon(step.ic) + '</span><div><p class="eyebrow">' + esc(step.eb) + '</p><h2>' + esc(step.title) + '</h2></div></div>' +
    '<div class="txt">' + step.text.map(p => '<p>' + md(p) + '</p>').join("") + '</div>' +
    (step.dica ? '<div class="dica">' + icon("idea") + '<p><b>Truque de memória:</b> ' + md(step.dica) + '</p></div>' : '') + '</article>';
}
function renderSummary(step, box) {
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("book") + '</span><div><p class="eyebrow">Cartão-resumo</p><h2>' + esc(step.title) + '</h2></div></div>' +
    '<ul class="ul txt">' + step.points.map(p => '<li>' + md(p) + '</li>').join("") + '</ul>' +
    '<p class="note">Dica: tire uma foto desta tela para revisar antes da prova.</p></article>';
}
function renderQuiz(step, box, onResult, label) {
  const opts = shuffle(step.o.map((t, i) => ({ t, i })));
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("idea") + '</span><div><p class="eyebrow">' + (label || (step.review ? "Revisão" : "Pergunta")) + '</p><h2>' + esc(step.q) + '</h2></div></div>' +
    '<div class="opts">' + opts.map((o, k) => '<button class="opt" data-i="' + o.i + '"><span class="l">' + "ABC"[k] + '</span><span>' + esc(o.t) + '</span></button>').join("") + '</div><div class="fb" id="fb" hidden></div></article>';
  let answered = false;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const i = +b.dataset.i, ok = i === step.a;
    box.querySelectorAll(".opt").forEach(x => { x.disabled = true; const xi = +x.dataset.i; if (xi === step.a) x.classList.add("right"); else if (x === b) x.classList.add("miss"); else x.classList.add("fade"); });
    const fb = box.querySelector("#fb"); fb.hidden = false;
    const explain = () => { if (st.settings.autoVoice || video) speak(step.key + "-ex"); };
    if (ok) {
      fb.className = "fb ok withav"; fb.innerHTML = '<span class="fbav">' + avSvg(P.av, "jump") + '</span><b>' + pick(YES) + '</b><span>' + esc(step.ex) + '</span>';
      const r = b.getBoundingClientRect(), cr = box.getBoundingClientRect(); box.style.position = "relative";
      burst(box, (r.left - cr.left + r.width / 2) + "px", (r.top - cr.top + r.height / 2) + "px", 12);
      celebrate(explain);
    }
    else { fb.className = "fb almost"; fb.innerHTML = '<b>Quase!</b><span>A resposta certa é: <strong>' + esc(step.o[step.a]) + '</strong>. ' + esc(step.ex) + (step.review || label ? '' : ' Essa pergunta volta no final, para revisar.') + '</span>'; explain(); }
    onResult(ok);
  });
}
function renderOrder(step, box) {
  const right = step.items.slice().sort((a, b) => a.y - b.y);
  let placed = 0, wrongs = 0;
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("calendar") + '</span><div><p class="eyebrow">Jogo da linha do tempo</p><h2>' + esc(step.title) + '</h2></div></div>' +
    '<p>Toque nos acontecimentos do <strong>mais antigo</strong> para o <strong>mais novo</strong>.</p><ol class="line" id="line"></ol><div class="pool" id="pool"></div><div class="fb" id="fb" hidden></div></article>';
  const line = box.querySelector("#line"), pool = box.querySelector("#pool"), fb = box.querySelector("#fb");
  const btnOf = new Map();
  shuffle(step.items).forEach(it => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = it.txt; btnOf.set(it, b);
    b.onclick = () => {
      if (it === right[placed]) {
        placed++; wrongs = 0; b.remove(); sfx.pop();
        pool.querySelectorAll(".hint").forEach(x => x.classList.remove("hint"));
        const li = document.createElement("li"); li.innerHTML = '<span class="yr">' + it.y + '</span><span>' + esc(it.txt) + '</span>'; line.appendChild(li);
        if (placed === right.length) { fb.hidden = false; fb.className = "fb ok"; fb.innerHTML = '<b>' + pick(YES) + '</b><span>A linha do tempo está completa. Leia os anos mais uma vez.</span>'; celebrate(); stepDone(step, true); }
        else fb.hidden = true;
      } else {
        wrongs++; shake(b); sfx.oops(); fb.hidden = false; fb.className = "fb almost";
        fb.innerHTML = '<span>Ainda não. Procure o que aconteceu <strong>antes</strong>.' + (wrongs >= 2 ? ' A Clio marcou uma pista com borda amarela.' : '') + '</span>';
        if (wrongs >= 2) btnOf.get(right[placed]).classList.add("hint");
      }
    };
    pool.appendChild(b);
  });
}
function renderMatch(step, box) {
  let sel = null, left = step.pairs.length;
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("puzzle") + '</span><div><p class="eyebrow">Jogo de ligar</p><h2>' + esc(step.title) + '</h2></div></div>' +
    '<p>1. Toque em uma <strong>palavra</strong>. 2. Depois toque no <strong>significado</strong> dela.</p>' +
    '<div class="pool" id="terms"></div><div class="defs" id="defs"></div><div class="fb" id="fb" hidden></div></article>';
  const terms = box.querySelector("#terms"), defs = box.querySelector("#defs"), fb = box.querySelector("#fb");
  shuffle(step.pairs.map((p, i) => i)).forEach(i => {
    const b = document.createElement("button"); b.className = "chip"; b.style.fontWeight = "700"; b.textContent = step.pairs[i][0]; b.dataset.i = i;
    b.onclick = () => { if (b.classList.contains("ok")) return; sfx.pop(); terms.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = i; fb.hidden = true; };
    terms.appendChild(b);
  });
  shuffle(step.pairs.map((p, i) => i)).forEach(i => {
    const d = document.createElement("button"); d.className = "chip"; d.textContent = step.pairs[i][1];
    d.onclick = () => {
      if (d.classList.contains("ok")) return;
      if (sel === null) { fb.hidden = false; fb.className = "fb almost"; fb.innerHTML = "<span>Primeiro toque em uma palavra lá em cima.</span>"; return; }
      if (sel === i) {
        const t = terms.querySelector('[data-i="' + i + '"]'); t.classList.remove("sel"); t.classList.add("ok"); t.disabled = true;
        d.classList.add("ok"); d.disabled = true; d.innerHTML = '<strong>' + esc(step.pairs[i][0]) + ':</strong> ' + esc(step.pairs[i][1]);
        sel = null; left--; fb.hidden = false; fb.className = "fb ok";
        if (left === 0) { fb.innerHTML = '<b>' + pick(YES) + '</b><span>Você ligou todas as palavras.</span>'; celebrate(); stepDone(step, true); }
        else { fb.innerHTML = '<span>Certo! Faltam ' + left + '.</span>'; sfx.coin(); }
      } else { shake(d); sfx.oops(); fb.hidden = false; fb.className = "fb almost"; fb.innerHTML = "<span>Esse não combina com <strong>" + esc(step.pairs[sel][0]) + "</strong>. Tente outro.</span>"; }
    };
    defs.appendChild(d);
  });
}
function renderSort(step, box) {
  const items = shuffle(step.items); let k = 0, hits = 0;
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("people") + '</span><div><p class="eyebrow">Jogo de separar</p><h2>' + esc(step.title) + '</h2></div></div><div id="sbody" style="display:flex;flex-direction:column;gap:14px"></div></article>';
  const body = box.querySelector("#sbody");
  function show() {
    const it = items[k];
    body.innerHTML = '<p class="count">' + (k + 1) + ' de ' + items.length + '</p><div class="sortitem">' + esc(it.txt) + '</div><div class="bins">' + step.bins.map((b, i) => '<button class="bin" data-b="' + i + '">' + esc(b) + '</button>').join("") + '</div><div class="fb" id="fb" hidden></div>';
    body.querySelectorAll(".bin").forEach(btn => btn.onclick = () => {
      body.querySelectorAll(".bin").forEach(x => x.disabled = true);
      const ok = +btn.dataset.b === it.b; if (ok) { hits++; sfx.win(); confetti(18); } else sfx.oops();
      const fb = body.querySelector("#fb"); fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "almost");
      fb.innerHTML = '<b>' + (ok ? pick(YES) : "Quase!") + '</b><span>' + (ok ? "" : "O certo é: <strong>" + esc(step.bins[it.b]) + "</strong>. ") + esc(it.why) + '</span>';
      const c = document.createElement("button"); c.className = "btn sec big"; c.textContent = k < items.length - 1 ? "Continuar" : "Ver resultado";
      c.onclick = () => { k++; if (k < items.length) show(); else end(); };
      body.appendChild(c); c.focus();
    });
  }
  function end() { body.innerHTML = '<div class="fb ok"><b>Jogo completo!</b><span>Você acertou ' + hits + ' de ' + items.length + '.</span></div>'; stepDone(step, true); }
  show();
}

function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function renderWrite(step, box) {
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("pencil") + '</span><div><p class="eyebrow">Treino de resposta escrita</p><h2>' + esc(step.q) + '</h2></div></div>' +
    '<p>Escreva com as suas palavras, como na prova. Não precisa ficar perfeito.</p>' +
    '<textarea class="wbox" id="wa-' + step.id + '" placeholder="Escreva aqui a sua resposta"></textarea>' +
    '<button class="btn sec big" id="wcheck">Ver a resposta da Clio</button><div id="wres" style="display:flex;flex-direction:column;gap:12px"></div></article>';
  const ta = box.querySelector("textarea"), res = box.querySelector("#wres");
  ta.value = st.writes[step.id] || "";
  ta.oninput = () => { st.writes[step.id] = ta.value; save(); };
  box.querySelector("#wcheck").onclick = () => {
    const txt = norm(ta.value);
    if (txt.trim().split(/\s+/).length < 3) { res.innerHTML = '<div class="fb almost"><span>Escreva pelo menos uma frase antes de ver a resposta.</span></div>'; return; }
    const got = step.ideas.map(i => i.w.some(k => txt.includes(norm(k))));
    const n = got.filter(Boolean).length, all = n === got.length;
    res.innerHTML = '<div class="fb ' + (all ? 'ok' : 'almost') + '"><b>' + (all ? 'Resposta completa!' : 'Boa! Você lembrou de ' + n + ' de ' + got.length + ' ideias.') + '</b><span>' + (all ? 'Você colocou todas as ideias importantes.' : 'Veja abaixo o que faltou e leia a resposta da Clio.') + '</span></div>' +
      '<ul class="ideas">' + step.ideas.map((i, k) => '<li class="' + (got[k] ? 'got' : '') + '"><span>' + (got[k] ? '+' : '?') + '</span>' + (got[k] ? 'Você escreveu: ' : 'Faltou: ') + esc(i.l) + '</li>').join("") + '</ul>' +
      '<div class="dica">' + icon("idea") + '<p><b>Resposta da Clio:</b> ' + esc(step.model) + '</p></div>';
    if (all) celebrate();
    stepDone(step, true);
    if (st.settings.autoVoice) speak(step.key + "-ex");
  };
}
function renderVideo(step, box) {
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("play") + '</span><div><p class="eyebrow">Vídeo de abertura</p><h2>' + esc(S.w.title) + '</h2></div></div>' +
    '<video class="vplayer" src="' + step.src + '" controls playsinline preload="metadata"></video><p class="note">Assista e depois toque em Próximo.</p></article>';
}

/* ---------- Corrida de obstáculos: cada acerto faz aparecer a próxima plataforma ---------- */
function openObby(wid) {
  stopSpeak(); S = null; E = null; video = false;
  const w = W.find(x => x.id === wid);
  const qs = shuffle(w.steps.filter(s => s.t === "quiz")).slice(0, 8);
  if (!qs.length) { home(); return; }
  O = { w, queue: qs, total: qs.length, plat: 0, tries: 0 };
  renderObby();
}
function obbyTrack() {
  const n = O.total + 1; let h = '<div class="obby" id="obby"><div class="track">';
  for (let i = 0; i < n; i++) h += '<div class="plat' + (i === n - 1 ? ' goal' : '') + (i > O.plat + 1 ? ' far' : (i === O.plat + 1 ? ' next' : '')) + '"><span></span></div>';
  h += '</div>' + FLAG.replace('class="flag"', 'class="goalflag"') + '<span class="runner" id="runner" style="left:' + ((O.plat + .5) / n * 100) + '%">' + avSvg(P.av, "idle") + '</span><span class="lava"></span></div>';
  return h;
}
function renderObby() {
  const q = O.queue[0];
  const box = shell(O.w.cls, "Corrida · " + O.w.title, O.plat / O.total, O.plat + "/" + O.total);
  const bNext = document.getElementById("bNext"), bBack = document.getElementById("bBack"), bSpeak = document.getElementById("bSpeak");
  bBack.textContent = "Mapa"; bBack.onclick = home; bNext.disabled = true; bNext.textContent = "Continuar";
  if (bSpeak) { if (!AUDIO.has(q.key)) bSpeak.style.visibility = "hidden"; bSpeak.onclick = () => speak(q.key); }
  box.innerHTML = obbyTrack() + '<div id="oq" style="margin-top:14px"></div>';
  renderQuiz(q, box.querySelector("#oq"), ok => {
    O.tries++;
    if (ok) {
      O.plat++; O.queue.shift(); gain(3);
      const ob = document.getElementById("obby"), n = O.total + 1;
      ob.querySelectorAll(".plat").forEach((p, i) => { p.classList.toggle("far", i > O.plat + 1); p.classList.toggle("next", i === O.plat + 1); });
      const r = document.getElementById("runner"); r.style.left = ((O.plat + .5) / n * 100) + "%";
      const av = r.querySelector(".av"); av.classList.remove("idle"); void av.getBoundingClientRect(); av.classList.add("jump"); sfx.jump();
      document.getElementById("starsTop").innerHTML = icon("star") + O.plat + "/" + O.total;
    } else { miss(); O.queue.push(O.queue.shift()); }
    bNext.disabled = false;
  }, "Corrida: plataforma " + (O.plat + 1) + " de " + O.total);
  if (st.settings.autoVoice) speak(q.key);
  bNext.onclick = () => { stopSpeak(); if (!O.queue.length) obbyEnd(); else renderObby(); };
}
function obbyEnd() {
  const firstRun = !st.obby[O.w.id]; st.obby[O.w.id] = true; save();
  const box = shell(O.w.cls, "Corrida completa", 1, O.total + "/" + O.total);
  box.innerHTML = '<div class="card center"><div class="endav">' + avSvg(P.av, "dance") + '</div><p class="eyebrow">Você chegou à bandeira</p><h2>Corrida completa, ' + esc(P.name) + '!</h2>' +
    '<p class="bigscore">' + O.total + ' plataformas</p><p>' + (O.tries === O.total ? 'Sem nenhum erro!' : 'Você respondeu ' + O.tries + ' vezes até chegar.') + '</p></div>';
  const bNext = document.getElementById("bNext"), bBack = document.getElementById("bBack"), bSpeak = document.getElementById("bSpeak");
  if (bSpeak) bSpeak.style.visibility = "hidden";
  bBack.textContent = "Mapa"; bBack.onclick = home; bNext.disabled = false; bNext.textContent = "Correr de novo"; const wid = O.w.id; bNext.onclick = () => openObby(wid);
  sfx.fanfare(); confetti(80);
  setTimeout(() => gain(firstRun ? 40 : 10, box.querySelector(".bigscore")), 500);
  badge("corrida");
}

/* ---------- Pintar ---------- */
function picOpen(p) { return !p.need || !!(st.worlds[p.need] || {}).done; }
function picSvg(p, live) {
  const fills = st.paint[p.id] || {};
  const body = p.svg.replace(/data-r="([^"]+)"/g, (m, r) => m + ' fill="' + (fills[r] || "#FFFFFF") + '"' + (live ? '' : ' stroke="#2A2A2A" stroke-width="2.5"'));
  return '<svg ' + (live ? 'class="paint" id="paint" ' : '') + 'viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + esc(p.title) + '">' + body + '</svg>';
}
function openPaint(p) {
  stopSpeak(); S = null; O = null; video = false;
  let color = COLORS[2]; const hist = [];
  const box = shell("w-x", "Pintar: " + p.title, 1, "");
  document.getElementById("starsTop").hidden = true;
  const bNext = document.getElementById("bNext"), bBack = document.getElementById("bBack"), bSpeak = document.getElementById("bSpeak");
  if (bSpeak) bSpeak.style.visibility = "hidden";
  box.innerHTML = '<article class="card"><div class="cardhead"><span class="bigic">' + icon("brush") + '</span><div><p class="eyebrow">Quadro para pintar</p><h2>' + esc(p.title) + '</h2></div></div>' +
    '<p>' + esc(p.fact) + '</p><p class="note">Escolha uma cor e toque nas partes do desenho.</p>' +
    '<div style="position:relative" id="pwrap">' + picSvg(p, true) + '</div><div class="colors" id="cols">' + COLORS.map(c => '<button class="col' + (c === color ? ' sel' : '') + '" style="background:' + c + '" data-c="' + c + '" aria-label="Cor ' + c + '"></button>').join("") + '</div>' +
    '<div class="row"><button class="btn sec" id="undo">Desfazer</button><button class="btn sec" id="clear">Apagar tudo</button></div><p class="note" id="clearmsg" hidden></p></article>';
  box.querySelectorAll(".col").forEach(b => b.onclick = () => { color = b.dataset.c; sfx.pop(); box.querySelectorAll(".col").forEach(x => x.classList.toggle("sel", x === b)); });
  const svg = box.querySelector("#paint"), wrap = box.querySelector("#pwrap");
  const regions = new Set(Array.from(svg.querySelectorAll("[data-r]")).map(el => el.getAttribute("data-r")));
  svg.addEventListener("click", e => {
    const el = e.target.closest("[data-r]"); if (!el) return;
    const r = el.getAttribute("data-r"); const f = st.paint[p.id] = st.paint[p.id] || {};
    hist.push([r, f[r] || "#FFFFFF"]); f[r] = color; el.setAttribute("fill", color); save(); sfx.pop();
    const wr = wrap.getBoundingClientRect(); burst(wrap, (e.clientX - wr.left) + "px", (e.clientY - wr.top) + "px", 6, color);
    if (Array.from(regions).every(k => f[k] && f[k] !== "#FFFFFF")) badge("pintora");
  });
  box.querySelector("#undo").onclick = () => { const h = hist.pop(); if (!h) return; st.paint[p.id][h[0]] = h[1]; svg.querySelector('[data-r="' + h[0] + '"]').setAttribute("fill", h[1]); save(); };
  let armed = false;
  box.querySelector("#clear").onclick = () => {
    const m = box.querySelector("#clearmsg");
    if (!armed) { armed = true; m.hidden = false; m.textContent = "Toque de novo em \"Apagar tudo\" para confirmar."; return; }
    st.paint[p.id] = {}; save(); openPaint(p);
  };
  bBack.style.visibility = "visible"; bBack.disabled = false; bBack.textContent = "Mapa"; bBack.onclick = home;
  const nxt = W.find(w => !(st.worlds[w.id] || {}).done);
  bNext.disabled = false; bNext.textContent = nxt ? "Ir para a Ilha " + nxt.n : "Ir para o castelo";
  bNext.onclick = () => nxt ? openWorld(nxt.id) : openExam();
}

/* ---------- Prova simulada (o castelo) ---------- */
function openExam() {
  stopSpeak(); S = null; O = null; video = false;
  const qs = [];
  // Sempre 15 questões (a nota, a medalha e o castelo contam "de 15"), repartidas entre as ilhas.
  const porIlha = Math.ceil(15 / W.length);
  W.forEach(w => { shuffle(w.steps.filter(s => s.t === "quiz")).slice(0, porIlha).forEach(q => qs.push(q)); });
  E = { qs: shuffle(qs).slice(0, 15), i: 0, score: 0, wrong: [], answered: false };
  renderExam();
}
function renderExam() {
  const q = E.qs[E.i];
  const box = shell("w-x", "Prova simulada", (E.i + 1) / E.qs.length, E.score + " acertos");
  const bNext = document.getElementById("bNext"), bBack = document.getElementById("bBack"), bSpeak = document.getElementById("bSpeak");
  bBack.style.visibility = "hidden"; bNext.disabled = true;
  bNext.textContent = E.i === E.qs.length - 1 ? "Ver minha nota" : "Próxima";
  if (bSpeak) { if (!AUDIO.has(q.key)) bSpeak.style.visibility = "hidden"; bSpeak.onclick = () => speak(q.key); }
  const wtitle = W.find(w => w.steps.includes(q)).title;
  renderQuiz(q, box, ok => {
    if (ok) E.score++; else { miss(); E.wrong.push(q); st.misses[q.id] = (st.misses[q.id] || 0) + 1; save(); }
    document.getElementById("starsTop").innerHTML = icon("star") + E.score + " acertos";
    bNext.disabled = false;
  }, "Questão " + (E.i + 1) + " de " + E.qs.length + " · " + wtitle);
  if (st.settings.autoVoice) speak(q.key);
  bNext.onclick = () => { stopSpeak(); if (E.i < E.qs.length - 1) { E.i++; renderExam(); } else examEnd(); };
}
function examEnd() {
  const n = E.qs.length, s = E.score;
  if (st.examBest == null || s > st.examBest) { st.examBest = s; }
  save();
  const msg = s >= 13 ? "Você está prontíssima para a prova!" : s >= 10 ? "Muito bom! Revise as que errou e faça de novo." : "Você está aprendendo. Revise os resumos e tente de novo.";
  const box = shell("w-x", "Prova simulada", 1, s + " acertos");
  box.innerHTML = '<div class="card center"><div class="endav">' + avSvg(P.av, s >= 10 ? "dance" : "idle") + '</div><p class="eyebrow">Sua nota</p><p class="bigscore">' + s + ' de ' + n + '</p><h2>' + msg + '</h2></div>' +
    (E.wrong.length ? '<div class="card" style="margin-top:16px"><h2>Para revisar</h2><ol class="ul">' + E.wrong.map(q => '<li>' + esc(q.q) + '<br><strong>' + esc(q.o[q.a]) + '</strong></li>').join("") + '</ol></div>' : '');
  const bNext = document.getElementById("bNext"), bBack = document.getElementById("bBack");
  bBack.style.visibility = "visible"; bBack.textContent = "Mapa"; bBack.onclick = home;
  bNext.disabled = false; bNext.textContent = "Fazer outra prova"; bNext.onclick = openExam;
  if (s >= 10) { sfx.fanfare(); confetti(90); }
  setTimeout(() => gain(s * 2, box.querySelector(".bigscore")), 500);
  if (s >= 13) badge("prova");
}

home();
})();
</script>
